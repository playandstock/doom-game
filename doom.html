
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM - GitHub Pages</title>
  <script src="https://js-dos.com/6.22/js-dos.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #111;
      color: #fff;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 20px;
    }
    #dosbox {
      width: 960px;
      height: 600px;
      border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <h1>🎮 GitHub Pages에서 DOOM을 플레이하세요! 🎮</h1>
  <div id="dosbox"></div>
  <script>
    Dos(document.getElementById("dosbox")).ready(function (fs) {
      fs.run("doom.jsdos");
    });
  </script>
</body>
</html>

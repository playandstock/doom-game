<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM - GitHub Pages</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <script src="js-dos-full.js"></script> <!-- 로컬 js-dos-full.js -->
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #111;
      color: #fff;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 20px;
    }
    #dosbox {
      width: 960px;
      height: 600px;
      border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <h1>🎮 GitHub Pages에서 DOOM을 플레이하세요! 🎮</h1>
  <div id="dosbox"></div>
  <script>
    window.addEventListener("load", function () {
      Dos(document.getElementById("dosbox")).then(function (runtime) {
        runtime.fs.extract("doom.jsdos").then(function () {
          runtime.main(["-c", "doom.exe"]);
        });
      }).catch(function (e) {
        console.error("DOOM 실행 중 오류 발생:", e);
      });
    });
  </script>
</body>
</html>

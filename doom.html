<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOOM - GitHub Pages</title>
  <!-- js-dos 스타일 시트 -->
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <!-- js-dos 스크립트 (로컬 경로) -->
  <script src="js-dos-full.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #111;
      color: #fff;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 20px;
    }
    #dosbox {
      width: 960px;
      height: 600px;
      border: 4px solid #fff;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <h1>🎮 GitHub Pages에서 DOOM을 플레이하세요! 🎮</h1>
  <div id="dosbox"></div>
  <script>
    window.addEventListener("load", function () {
      JSdosbox(document.getElementById("dosbox")).then((dosbox) => {
        dosbox.run("doom.jsdos");
      });
    });
  </script>
</body>
</html>
